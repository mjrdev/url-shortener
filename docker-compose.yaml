services:

  # api:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DB_HOST: database
  #     DB_PORT: 5432
  #     DB_USER: postgres
  #     DB_PASSWORD: password
  #     DB_NAME: urlshortener
  #     DB_SSLMODE: disable
  #   depends_on:
  #     - database

  database:
    image: postgres:17.10
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - type: tmpfs
        target: /dev/shm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: urlshortener

  redis:
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
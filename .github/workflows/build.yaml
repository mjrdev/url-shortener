name: Test, Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC - Conta A
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::723307322553:role/urlshortener-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Assume role Conta B
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::804306814577:role/github_pipeline
          aws-region: ${{ vars.AWS_REGION }}
          role-chaining: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build -f Dockerfile -t vars.ECR_REGISTRY/secrets.ECR_REPOSITORY:test-$IMAGE_TAG .

      # - name: Run tests
      #   run: |
      #     docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:test-$IMAGE_TAG'php artisan test --coverage --min=80

      # - name: Build production image
      #   run: |
      #     docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          docker push vars.ECR_REGISTRY/secrets.ECR_REPOSITORY:$IMAGE_TAG